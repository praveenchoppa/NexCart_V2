
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexCart WebSocket Tester</title>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 760px; margin: 30px auto; padding: 0 16px; }
        input, button { padding: 10px; margin: 5px 0; box-sizing: border-box; }
        input { width: 100%; }
        button { cursor: pointer; }
        #log { background: #f2f2f2; padding: 12px; min-height: 180px; white-space: pre-wrap; overflow-wrap: anywhere; }
    </style>
</head>
<body>
    <h1>NexCart WebSocket Tester</h1>

    <label for="token">JWT (keep it private — never logged)</label>
    <input id="token" type="password" placeholder="Paste your JWT here (optional for backend rejection tests)">

    <label for="conversationId">Conversation ID</label>
    <input id="conversationId" type="number" value="1" min="1">

    <button id="connect">Connect</button>
    <button id="disconnect" disabled>Disconnect</button>

    <hr>

    <label for="message">Message</label>
    <input id="message" maxlength="2000" placeholder="Type a test message">

    <button id="send" disabled>Send message</button>

    <h3>Connection log</h3>
    <div id="log"></div>

    <script>
        const logElement = document.getElementById("log");
        const tokenInput = document.getElementById("token");
        const conversationInput = document.getElementById("conversationId");
        const connectButton = document.getElementById("connect");
        const disconnectButton = document.getElementById("disconnect");
        const sendButton = document.getElementById("send");
        let client = null;
        let subscription = null;

        function log(message) {
            logElement.textContent += message + "\n";
        }

        function resetUiAfterDisconnect() {
            connectButton.disabled = false;
            disconnectButton.disabled = true;
            sendButton.disabled = true;
        }

        connectButton.addEventListener("click", () => {
            const token = tokenInput.value.trim();
            const conversationId = conversationInput.value.trim();

            if (!conversationId || Number(conversationId) < 1) {
                log("Enter a valid conversation ID.");
                return;
            }

            if (!window.StompJs) {
                log("STOMP library failed to load. Check your internet connection and reload.");
                return;
            }

            client = new StompJs.Client({
                brokerURL: "ws://localhost:8080/ws",
                connectHeaders: token
                    ? { Authorization: "Bearer " + token }
                    : {},
                reconnectDelay: 0,
                heartbeatIncoming: 10000,
                heartbeatOutgoing: 10000,

                onConnect: () => {
                    log("STOMP CONNECTED (server accepted CONNECT).");
                    connectButton.disabled = true;
                    disconnectButton.disabled = false;
                    sendButton.disabled = false;

                    log("Sending SUBSCRIBE request for conversation " + conversationId + "...");

                    subscription = client.subscribe(
                        "/topic/conversations/" + conversationId,
                        (frame) => {
                            log("MESSAGE RECEIVED on subscribed topic:\n" + frame.body);
                        },
                        (errorFrame) => {
                            log("SUBSCRIBE ERROR: " + (errorFrame.headers.message || "No error message"));
                            if (errorFrame.body) {
                                log(errorFrame.body);
                            }
                        }
                    );

                    log("SUBSCRIBE request sent (awaiting server authorization).");
                },

                onStompError: (frame) => {
                    log("STOMP ERROR: " + (frame.headers.message || "No error message"));
                    if (frame.body) {
                        log(frame.body);
                    }
                },

                onWebSocketError: () => {
                    log("WebSocket transport error. Check the backend and browser console.");
                },

                onWebSocketClose: (event) => {
                    log("WebSocket closed (code=" + (event ? event.code : "unknown") + ").");
                    resetUiAfterDisconnect();
                },

                onDisconnect: () => {
                    log("STOMP DISCONNECTED.");
                    resetUiAfterDisconnect();
                }
            });

            client.activate();
            log("Opening WebSocket to ws://localhost:8080/ws ...");
        });

        disconnectButton.addEventListener("click", async () => {
            if (client) {
                await client.deactivate();
                client = null;
            }
            subscription = null;
            resetUiAfterDisconnect();
            log("Disconnected by user.");
        });

        sendButton.addEventListener("click", () => {
            const content = document.getElementById("message").value.trim();
            const conversationId = Number(conversationInput.value);

            if (!client || !client.connected || !content) {
                log("Connect first and enter a message.");
                return;
            }

            client.publish({
                destination: "/app/chat.send",
                headers: { "content-type": "application/json" },
                body: JSON.stringify({ conversationId, content })
            });

            log("SEND published to /app/chat.send.");
            document.getElementById("message").value = "";
        });
    </script>
</body>
</html>
